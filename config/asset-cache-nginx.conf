worker_processes auto;
worker_rlimit_nofile 65535;

events {
  multi_accept on;
  use epoll;
}

http {
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # Explicitly set resolver to Docker's internal DNS with valid time
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_cache_path /tmp/nginx/cache levels=1:2 keys_zone=asset_cache:10m max_size=512m inactive=60m use_temp_path=off;
  proxy_cache_key "$request_method|$scheme|$proxy_host|$request_uri|$request_body";
  proxy_cache_min_uses 1;
  proxy_cache_lock on;
  proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  proxy_cache_background_update on;
  proxy_cache_revalidate on;

  # Freshness label for the cached location, derived from the upstream status.
  # From bsv-blockchain/teranode#1377 (issue 1368).
  #
  # This nginx stores only 200s (proxy_cache_valid), but labelling a 4xx/5xx
  # "public, max-age=300" licenses any cache in front of it (an operator CDN or
  # ingress, a proxy between peers) to store and replay the failure for five
  # minutes (RFC 9111 section 3). Teranode's asset service answers a zero-byte
  # source with 500 instead of an empty 200, so 5xx is an expected outcome on
  # these routes and has to be labelled no-store.
  #
  # The "" arm is required: on a cache HIT no upstream is contacted and
  # $upstream_status is empty, which must stay cacheable. A comma-separated
  # $upstream_status (proxy_next_upstream retried) and a revalidated 304 both
  # fall to default, i.e. no-store: conservative, never the other way. A stale
  # 200 served because the upstream failed also goes out no-store; that only
  # lasts for the outage and fails in the safe direction.
  map $upstream_status $asset_cache_control {
    default "no-store";              # 4xx/5xx: never store, never replay
    200     "public, max-age=300";
    ""      "public, max-age=300";   # cache HIT — no upstream was contacted
  }

  # Set timeouts for upstream connections
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;  # Increased for large request bodies
  proxy_read_timeout 120s; # Increased for large responses

  # Retry connecting to upstream servers
  proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
  proxy_next_upstream_timeout 10s;
  proxy_next_upstream_tries 3;

  log_format cache_log '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'cache_status: $upstream_cache_status '
                        'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /dev/stdout cache_log;

  server {
    listen 8000;

    # Use variable to force DNS re-resolution
    set $asset_backend "asset:8090";

    location ~ ^/api/v1/(subtree|subtree_data|block|blocks|header|headers|block_legacy|headers_to_common_ancestor|headers_from_common_ancestor|bestblockheader)/([0-9a-fA-F]+)$ {
      proxy_cache asset_cache;
      proxy_cache_valid 200 1m;
      proxy_cache_methods GET;

      # Narrower than the http{}-level default (which includes http_500): a 500
      # from asset on these routes is a content fault for one specific hash, not
      # a transient outage, so retrying cannot change the answer and would cost
      # up to proxy_next_upstream_tries backend calls per request once asset is
      # scaled and Docker DNS returns several addresses.
      proxy_next_upstream error timeout http_502 http_503 http_504;

      # Talk HTTP/1.1 upstream so responses are chunk-framed. On nginx's default
      # HTTP/1.0 a body without Content-Length ends at connection close, so an
      # aborted upstream stream looks complete and nginx caches a truncated or
      # empty subtree_data as a valid 200, replayed until catchup stalls
      # (teranode issue 1368). The asset service signals an abort by closing
      # without the chunked terminator, which only exists on HTTP/1.1; nginx then
      # logs "upstream prematurely closed connection" and discards the entry.
      # Connection "" clears the hop-by-hop header that pairs with 1.1. It buys
      # no keepalive here: proxy_pass to a variable disables upstream connection
      # reuse.
      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_pass http://$asset_backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Cache-Status $upstream_cache_status always;

      # always: attach on every status, including the ones nginx generates
      # itself. The value comes from the $asset_cache_control map, so a 4xx/5xx
      # is labelled no-store instead of inheriting the 300s freshness lifetime.
      add_header Cache-Control $asset_cache_control always;
    }

    location ~ ^/api/v1/(tx|txs|subtree/[0-9a-fA-F]+/txs)$ {
      proxy_pass http://$asset_backend;

      # Explicitly disable caching for this endpoint
      proxy_no_cache 1;
      proxy_cache_bypass 1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      add_header X-Cache-Status $upstream_cache_status;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
    }

    # Block all other requests
    location / {
        return 404;
    }
  }
}
