# Aerospike database configuration file
# This template sets up a multi-node, single namespace developer environment.

# This stanza must come first.
service {
	cluster-name docker

	# Explicit node-id — Aerospike on Docker/OrbStack (macOS, aarch64) cannot
	# always derive one from a container interface MAC and exits with
	# "could not get node id". A constant value is fine for a single-node setup.
	node-id a1

	# proto-fd-max raises client connection ceiling (default 15,000). Teranode
	# SetMinedMulti fans out into ~574 sub-requests per call; concurrent batches
	# can saturate the default. 30,000 = comfortable headroom.
	proto-fd-max 30000

	# service-threads / batch-index-threads are dynamic in 8.x; defaults
	# (cores / cores÷2) are fine. aerospike-tune.sh does not touch them.

	sindex-builder-threads 8
}

logging {
	# Send log messages to stdout
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		# mesh is used for environments that do not support multicast
		mode mesh
		# Single-node setup: bind to loopback. On Docker/OrbStack
		# (macOS, aarch64), `address any` fails interface enumeration
		# ("no IPv4 addresses configured"); `local` sidesteps it.
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		# Intra-cluster communication port (migrates, replication, etc).
		# See heartbeat note — single-node, bind to loopback.
		address local
		port 3001
	}
}

namespace utxo-store {
    stop-writes-sys-memory-pct 90

    default-ttl           0
    nsup-period           120
    nsup-threads          1
    transaction-pending-limit 0

    replication-factor    1
    # Changing partition-tree-sprigs requires wiping utxostore.dat —
    # no effect on a populated namespace. Leave at 4096 unless rebuilding.
    partition-tree-sprigs 4096

    storage-engine device {
        # for full IBD, direct disk access is preferred
        # device            /dev/nvme2n1  # replace nvme2n1 with your actual disk identifier

        # multiple devices is recommended
        file              /opt/aerospike/data/utxostore.dat
        filesize          1024G

        # For fresh instances on multi-disk hosts, prefer splitting the namespace
        # across multiple files — parallelizes defrag/write/read I/O queues.
        # Requires wipe of existing utxostore.dat. Sum filesize must match needs.
        # file              /opt/aerospike/data/utxostore-1.dat
        # filesize          512G
        # file              /opt/aerospike/data/utxostore-2.dat
        # filesize          512G

        # for testing purposes you can also define a smaller file
        # file              /opt/aerospike/data/test.dat
        # filesize          100G

        # 1M flush-size cuts flush event count vs the older 128K. RESTART REQUIRED to change.
        flush-size 1M

        # Post-write read cache (in wblocks). Helps absorb read-after-write under defrag.
        # aerospike-tune.sh raises to 2048 during IBD.
        post-write-cache 1024

        # defrag-lwm-pct: wblocks <50% filled are eligible. 50 = AS default = 2x write amp.
        # aerospike-tune.sh raises temporarily to 70 during IBD (4x WA, more eligible wblocks)
        # to rebuild available_pct. See AS docs for the WA curve.
        defrag-lwm-pct 50

        # defrag-sleep is in MICROSECONDS (not ms). 1000 = 1ms = AS default.
        # aerospike-tune.sh sets to 0 during IBD to drain defrag_q as fast as device allows.
        defrag-sleep 1000

        # Eviction threshold
        evict-used-pct 70
        # Cache settings
        read-page-cache true
        # Maximum flush delay in milliseconds
        flush-max-ms 1000

        sindex-startup-device-scan true

        # max-write-cache: standing RAM ceiling for buffered writes. High = more burst headroom,
        # more risk on crash. aerospike-tune.sh raises to 8192M during IBD.
        # monitor with: asadm -e "show statistics like write_q"
        max-write-cache 4096M
    }
}
