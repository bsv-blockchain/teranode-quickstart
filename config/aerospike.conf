# Aerospike database configuration file
# This template sets up a multi-node, single namespace developer environment.

# This stanza must come first.
service {
	cluster-name docker

	# Explicit node-id — Aerospike on Docker/OrbStack (macOS, aarch64) cannot
	# always derive one from a container interface MAC and exits with
	# "could not get node id". A constant value is fine for a single-node setup.
	node-id a1

	# proto-fd-max raises client connection ceiling (default 15,000). Teranode
	# SetMinedMulti fans out into ~574 sub-requests per call; concurrent batches
	# can saturate the default. 30,000 = comfortable headroom.
	proto-fd-max 30000

	# service-threads / batch-index-threads are dynamic in 8.x; defaults
	# (cores / cores÷2) are fine. aerospike-tune.sh does not touch them.

	sindex-builder-threads 8
}

logging {
	# Send log messages to stdout
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}

	heartbeat {
		# mesh is used for environments that do not support multicast
		mode mesh
		# Single-node setup: bind to loopback. On Docker/OrbStack
		# (macOS, aarch64), `address any` fails interface enumeration
		# ("no IPv4 addresses configured"); `local` sidesteps it.
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		# Intra-cluster communication port (migrates, replication, etc).
		# See heartbeat note — single-node, bind to loopback.
		address local
		port 3001
	}
}

namespace utxo-store {
    stop-writes-sys-memory-pct 90

    default-ttl           0
    nsup-period           120
    nsup-threads          1
    transaction-pending-limit 0

    replication-factor    1
    partition-tree-sprigs 4096

    storage-engine device {
        # for full IBD, direct disk access is preferred
        # device            /dev/nvme2n1  # replace nvme2n1 with your actual disk identifier

        # multiple devices is recommended
        file              /opt/aerospike/data/utxostore.dat
        filesize          1024G

        # for testing purposes you can also define a smaller file
        # file              /opt/aerospike/data/test.dat
        # filesize          100G

        flush-size 128K
        # Post-write cache to reduce I/O pressure (renamed from post-write-queue in v7.1)
        post-write-cache 256
        # Defrag settings - less aggressive to reduce write amplification
        defrag-lwm-pct 50
        defrag-sleep 2000
        # Eviction threshold
        evict-used-pct 70
        # Cache settings
        read-page-cache true
        # Maximum flush delay in milliseconds
        flush-max-ms 1000

        sindex-startup-device-scan true

        # high number to allow slow storage to keep up in case of traffic peaks
        # can be dangerous if the instance crashes or the storage can't keep up at all
        # monitor the queue with `asadm -e "show statistics like write_q"`
        max-write-cache 2048M
    }
}
