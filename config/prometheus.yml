global:
  scrape_interval: 30s
  evaluation_interval: 30s

# blockassembly.rules.yml (and its unit tests, blockassembly.rules_test.yml) are
# byte-identical copies of deploy/docker/base/ in bsv-blockchain/teranode, as of
# teranode v0.16.0. Change them there, then copy them here; never edit them in
# this repo. docs/UPDATING.md has the drift check to run on a version bump.
rule_files:
  - 'blockassembly.rules.yml'

# Without this, alert rules are evaluated but firing alerts go nowhere except
# the Prometheus UI. Alertmanager ships with no notifier configured (see
# alertmanager.yml); README "Alerting" shows how to add one.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'teranode'
    static_configs:
      - targets: ['legacy:9091', 'blockchain:9091', 'asset:9091', 'rpc:9091', 'subtreevalidation:9091', 'blockvalidation:9091', 'blockassembly:9091']

  - job_name: 'aerospike'
    static_configs:
      # this is the target for the docker based Aerospike exporter
      - targets: ['aerospike-exporter:10145']
      # if you have a dedicated aerospike cluster, you can add the aerospike cluster nodes here
      # see https://aerospike.com/docs/monitorstack/install/linux on how to install
      # - targets: ['172.x.x.x:9145', '10.x.x.x:9145']
