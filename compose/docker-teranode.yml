x-teranode-base:
  &teranode-base
  image: ghcr.io/bsv-blockchain/teranode:${TERANODE_VERSION:-v0.15.1}
  networks:
    - teranode-network
  volumes:
    - ../config/wait.sh:/app/wait.sh
    - ../config/entrypoint.sh:/app/entrypoint.sh
    - teranode-data:/app/data
  env_file:
    - ../.env
  environment:
    SETTINGS_CONTEXT: ${SETTINGS_CONTEXT:-docker.m}

# Per-service MEM_LIMIT_* caps (written by setup.sh, see lib/mem_limits.sh).
# Teranode derives GOMEMLIMIT from the cgroup limit, so a capped service GCs
# instead of ballooning — and a runaway service OOM-restarts instead of
# starving Aerospike/Postgres on the host. 0 / unset = unlimited.

services:
  blockchain:
    <<: *teranode-base
    container_name: blockchain
    mem_limit: ${MEM_LIMIT_BLOCKCHAIN:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-blockchain=1"]
    environment:
      # Only blockchain waits on the data layer; downstream Teranode services
      # gate on `blockchain healthy` via depends_on, so by the time they start
      # aerospike + postgres + kafka are already ready.
      USE_LOCAL_AEROSPIKE: "true"
      USE_LOCAL_POSTGRES: "true"
      USE_LOCAL_KAFKA: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 60s
    restart: on-failure

  asset:
    <<: *teranode-base
    container_name: asset
    mem_limit: ${MEM_LIMIT_ASSET:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-asset=1"]
    ports:
      - "${HOST_IP:-127.0.0.1}:8090:8090"
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  legacy:
    <<: *teranode-base
    container_name: legacy
    mem_limit: ${MEM_LIMIT_LEGACY:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-legacy=1"]
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  subtreevalidation:
    <<: *teranode-base
    container_name: subtreevalidation
    mem_limit: ${MEM_LIMIT_SUBTREEVALIDATION:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-subtreevalidation=1"]
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  blockvalidation:
    <<: *teranode-base
    container_name: blockvalidation
    mem_limit: ${MEM_LIMIT_BLOCKVALIDATION:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-blockvalidation=1"]
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  blockassembly:
    <<: *teranode-base
    container_name: blockassembly
    mem_limit: ${MEM_LIMIT_BLOCKASSEMBLY:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-blockassembly=1"]
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  propagation:
    <<: *teranode-base
    container_name: propagation
    mem_limit: ${MEM_LIMIT_PROPAGATION:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-propagation=1"]
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      blockchain:
        condition: service_healthy
      blockvalidation:
        condition: service_healthy
      blockassembly:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  peer:
    <<: *teranode-base
    container_name: peer
    mem_limit: ${MEM_LIMIT_PEER:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-p2p=1"]
    ports:
      - "${HOST_IP:-127.0.0.1}:9905:9905"
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  rpc:
    <<: *teranode-base
    container_name: rpc
    mem_limit: ${MEM_LIMIT_RPC:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-rpc=1"]
    ports:
      - "127.0.0.1:9292:9292"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    depends_on:
      blockchain:
        condition: service_healthy
    restart: on-failure

  pruner:
    <<: *teranode-base
    container_name: pruner
    mem_limit: ${MEM_LIMIT_PRUNER:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-pruner=1"]
    depends_on:
      blockchain:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    restart: on-failure

  blockpersister:
    <<: *teranode-base
    container_name: blockpersister
    mem_limit: ${MEM_LIMIT_BLOCKPERSISTER:-0}
    entrypoint: ["/app/entrypoint.sh"]
    command: ["-blockpersister=1"]
    depends_on:
      blockchain:
        condition: service_healthy
      blockvalidation:
        condition: service_healthy
      blockassembly:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null --tries=1 --timeout=5 http://localhost:8000/health || [ $? = 8 ]"]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 7s
    profiles:
      - blockpersister
    restart: on-failure

  seeder:
    <<: *teranode-base
    container_name: seeder
    mem_limit: ${MEM_LIMIT_SEEDER:-0}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    volumes:
      - ../config/wait.sh:/app/wait.sh
      - ../config/entrypoint.sh:/app/entrypoint.sh
      - teranode-data:/app/data
      - ${SEED_DATA_PATH:-./}:/seed:ro
    depends_on:
      - aerospike
      - postgres
      - kafka-shared
    profiles:
      - seeding
